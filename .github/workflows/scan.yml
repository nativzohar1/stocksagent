name: Decoupling Hunter Scan

# ---------------------------------------------------------------------------
# Schedule: 21:30 UTC, Mon-Fri  (~30 min after the US market close), plus a
# 23:15 UTC backup run because GitHub delays — and sometimes silently DROPS —
# scheduled workflows. scan.py is idempotent: the backup run exits immediately
# if results/ already holds the current session, so it can never overwrite a
# clean close with an after-hours quote.
#
# v3.6.2 (2026-08-27): every date comparison here is US/EASTERN, not UTC.
# The 21:30 UTC cron leaves only 2h30m before the UTC date rolls over; on
# 2026-08-26 the queue delayed the run past midnight UTC and scan.py compared
# the 08-26 session against the 08-27 UTC date, fired its closed-market guard
# and skipped the scan (23-second green run, no commit). Eastern keeps the
# whole post-close window on one date.
#
# v3.6.1 (2026-08-25): SCAN_OUT_DIR must NEVER be the empty string. scan.py
# read it with os.getenv("SCAN_OUT_DIR", "results"); an env var that is SET BUT
# EMPTY defeats that default and yields Path("") == "." , so a whole scan was
# written to the repo ROOT while `git add results/` found nothing to commit.
# Both sides are now hardened: the scheduled branch is explicit here, and
# scan.py uses `or "results"`.
#
# Manual runs expose a "test_run" checkbox in the Actions tab:
#   test_run = false (default) -> identical to a scheduled run: writes results/,
#                                 commits and pushes.
#   test_run = true            -> bypasses the closed-market guard, writes to
#                                 results_test/, uploads an artifact, and NEVER
#                                 commits. Safe to run on a weekend or holiday.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '15 23 * * 1-5'   # backup: GitHub delays or silently drops scheduled runs
  workflow_dispatch:
    inputs:
      test_run:
        description: 'Test run (market closed) - writes results_test/, never commits'
        type: boolean
        default: false

permissions:
  contents: write                # needed to commit results/ back to the repo

concurrency:
  group: decoupling-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record environment
        run: |
          python -c "import sys; print('python', sys.version)"
          date -u '+UTC now: %Y-%m-%d %H:%M'
          TZ=America/New_York date '+ET  now: %Y-%m-%d %H:%M'
          pip freeze

      - name: Run scanner
        env:
          SCAN_FORCE_RUN: ${{ inputs.test_run && '1' || '0' }}
          SCAN_OUT_DIR:   ${{ inputs.test_run && 'results_test' || 'results' }}
        run: |
          set -o pipefail
          python scan.py 2>&1 | tee /tmp/scan.log

      - name: Verify results/ was actually refreshed
        if: ${{ !inputs.test_run }}
        run: |
          if grep -qE "NYSE Closed Today|already holds session" /tmp/scan.log; then
            echo "Guard fired (market closed, or session already scanned) - results/ intentionally untouched. OK."
            exit 0
          fi
          if [ ! -f results/out_summary.json ]; then
            echo "::error::results/out_summary.json does not exist after a full scan."
            exit 1
          fi
          sess=$(jq -r '.session_date' results/out_summary.json)
          gen=$(jq -r '.generated_utc'  results/out_summary.json)
          today=$(TZ=America/New_York date '+%Y-%m-%d')
          echo "session_date=$sess | generated_utc=$gen | today(ET)=$today"
          if [ "$sess" != "$today" ]; then
            echo "::error::Scanner reported success but results/ still holds session $sess (expected $today). Nothing was written where the agent reads."
            exit 1
          fi
          echo "results/ is fresh for session $sess."

      - name: Upload test results
        if: ${{ inputs.test_run }}
        uses: actions/upload-artifact@v4
        with:
          name: results_test-${{ github.run_id }}
          path: results_test/
          if-no-files-found: error

      - name: Commit & push results (skips on holidays / no-change / test runs)
        if: ${{ !inputs.test_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes (guard fired or identical output) - nothing to commit."
          else
            git commit -m "scan: update results ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
